<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Datos - Fútbol Americano</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 1920px;
            height: 1080px;
            /*background: rgba(187, 113, 2, 0.1); /* Ligero fondo transparente para verificar que el archivo cargó */
            overflow: hidden;
            position: relative;
        }

        .data-overlay-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 120px;
        }

        /* 1. ANIMACIÓN DE CASTIGO */
        .penalty-ribbon-wrapper {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 10;
            pointer-events: none;
        }
        .penalty-ribbon-wrapper.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .penalty-ribbon {
            background-color: #ffcc00;
            color: #000000;
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 20px;
            font-weight: 900;
            padding: 5px 35px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 2. MARCADOR */
        .score-box {
            position: absolute;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 190px;
            z-index: 5;
        }
        .score-number {
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 50px;
            color: #ffffff;
            width: 80px;
            text-align: center;
            line-height: 1;
        }

        /* 3. CUARTO */
        .quarter-box {
            position: absolute;
            bottom: 17px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }
        .quarter-text {
            font-family: 'Arial Black Condensed', 'Arial Narrow', 'Arial Black', sans-serif;
            font-size: 25px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* 4. POSESIÓN DEL BALÓN */
        .possession-line {
            position: absolute;
            top: 15px;
            height: 5px;
            width: 320px;
            background-color: #ff6600;
            border-radius: 3px;
            display: none;
            box-shadow: 0 0 6px #ff6600;
        }
        .possession-line.active {
            display: block;
        }
        #possessionLocal {
            left: 175px;
        }
        #possessionVisitor {
            right: 175px;
        }

        /* 5. TIEMPOS FUERA */
        .timeouts-group {
            position: absolute;
            bottom: 16px;
            display: flex;
            gap: 12px;
        }
        #timeoutsLocal {
            left: 185px;
        }
        #timeoutsVisitor {
            right: 185px;
        }
        .timeout-pill {
            width: 48px;
            height: 12px;
            background-color: #ff6600;
            border-radius: 6px;
            transition: opacity 0.25s ease;
        }
        .timeout-pill.used {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="data-overlay-container">
        
        <!-- CASTIGO -->
        <div class="penalty-ribbon-wrapper" id="penaltyWrapper">
            <div class="penalty-ribbon">CASTIGO</div>
        </div>

        <!-- POSESIÓN -->
        <div class="possession-line" id="possessionLocal"></div>
        <div class="possession-line" id="possessionVisitor"></div>

        <!-- MARCADOR -->
        <div class="score-box">
            <span class="score-number" id="scoreLocal">0</span>
            <span class="score-number" id="scoreVisitor">0</span>
        </div>

        <!-- CUARTO -->
        <div class="quarter-box">
            <span class="quarter-text" id="quarterDisplay">1ER. CUARTO</span>
        </div>

        <!-- TIEMPOS FUERA LOCAL -->
        <div class="timeouts-group" id="timeoutsLocal">
            <div class="timeout-pill" id="t-local-1"></div>
            <div class="timeout-pill" id="t-local-2"></div>
            <div class="timeout-pill" id="t-local-3"></div>
        </div>

        <!-- TIEMPOS FUERA VISITANTE -->
        <div class="timeouts-group" id="timeoutsVisitor">
            <div class="timeout-pill" id="t-visitor-1"></div>
            <div class="timeout-pill" id="t-visitor-2"></div>
            <div class="timeout-pill" id="t-visitor-3"></div>
        </div>

    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9ng9R66re2Kh8ji8HxitvF3OhcEHxGi4",
            authDomain: "ofamo-mexicahs.firebaseapp.com",
            projectId: "ofamo-mexicahs",
            storageBucket: "ofamo-mexicahs.firebasestorage.app",
            messagingSenderId: "95998679046",
            appId: "1:95998679046:web:8cdeb43879a592f8944b87"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const matchRef = ref(db, 'marcadorPartido');

            onValue(matchRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                document.getElementById('scoreLocal').innerText = data.scoreLocal ?? 0;
                document.getElementById('scoreVisitor').innerText = data.scoreVisitor ?? 0;
                document.getElementById('quarterDisplay').innerText = data.quarter ?? "1ER. CUARTO";

                updateTimeouts('Local', data.timeoutsLocal ?? 3);
                updateTimeouts('Visitor', data.timeoutsVisitor ?? 3);

                const possession = data.possession ?? "none";
                document.getElementById('possessionLocal').classList.toggle('active', possession === 'local');
                document.getElementById('possessionVisitor').classList.toggle('active', possession === 'visitor');

                document.getElementById('penaltyWrapper').classList.toggle('active', data.penalty ?? false);
            });
        } catch (e) {
            console.error("Error al conectar con Firebase:", e);
        }

        function updateTimeouts(team, count) {
            for (let i = 1; i <= 3; i++) {
                const pill = document.getElementById(`t-${team.toLowerCase()}-${i}`);
                if (pill) {
                    if (i <= count) {
                        pill.classList.remove('used');
                    } else {
                        pill.classList.add('used');
                    }
                }
            }
        }
    </script>
</body>
</html>
